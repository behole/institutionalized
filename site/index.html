<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Institutional Reasoning — Deliberation Board</title>
<style>
  :root {
    --bg: #0b0e14;
    --panel: #121722;
    --panel-edge: #1e2636;
    --text: #d7dee9;
    --dim: #6b7687;
    --led-off: #1a2230;
    --led-idle: #2a3548;
    --led-run: #ffb020;
    --led-green: #2ed573;
    --led-red: #ff4d4f;
    --led-amber: #ffaa33;
    --led-blue: #3aa0ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: ui-monospace, 'SF Mono', Menlo, monospace;
    min-height: 100vh; padding: 20px;
  }
  header { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
  header h1 { font-size: 15px; font-weight: 600; letter-spacing: 0.5px; }
  #status-led {
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--led-idle); box-shadow: 0 0 6px rgba(42,53,72,.6);
    transition: all .3s;
  }
  #status-led.running { background: var(--led-run); box-shadow: 0 0 12px var(--led-run); animation: pulse 1.1s infinite; }
  #status-led.done-ok { background: var(--led-green); box-shadow: 0 0 12px var(--led-green); }
  #status-led.done-no { background: var(--led-red); box-shadow: 0 0 12px var(--led-red); }
  #status-led.done-mid { background: var(--led-amber); box-shadow: 0 0 12px var(--led-amber); }
  #total-cost { margin-left: auto; color: var(--dim); font-size: 12px; }
  #total-cost b { color: var(--text); }

  .layout { display: grid; grid-template-columns: 300px 1fr 340px; gap: 16px; }
  @media (max-width: 1100px) { .layout { grid-template-columns: 1fr; } }

  .panel { background: var(--panel); border: 1px solid var(--panel-edge); border-radius: 10px; padding: 16px; }

  /* Input panel */
  textarea {
    width: 100%; min-height: 120px; resize: vertical;
    background: var(--bg); color: var(--text);
    border: 1px solid var(--panel-edge); border-radius: 8px;
    padding: 10px; font: inherit; font-size: 13px;
  }
  textarea:focus { outline: 1px solid var(--led-blue); }
  .chip-row { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; }
  .chip {
    padding: 5px 10px; border-radius: 999px; font-size: 11px; cursor: pointer;
    border: 1px solid var(--panel-edge); color: var(--dim); background: transparent;
  }
  .chip:hover { color: var(--text); }
  .chip.selected { color: #0b0e14; background: var(--led-blue); border-color: var(--led-blue); }
  #run-btn {
    width: 100%; padding: 11px; border: 0; border-radius: 8px; cursor: pointer;
    background: var(--led-green); color: #06220f; font: inherit; font-weight: 700; font-size: 13px;
  }
  #run-btn:disabled { background: var(--led-idle); color: var(--dim); cursor: not-allowed; }
  #routed-note { margin-top: 10px; font-size: 11px; color: var(--dim); min-height: 14px; }
  #routed-note b { color: var(--led-blue); }

  /* Board */
  #board { display: flex; gap: 0; align-items: stretch; justify-content: flex-start; overflow-x: auto; }
  .stage {
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    min-width: 190px; padding: 18px 14px; position: relative;
  }
  .stage + .stage::before {
    content: ''; position: absolute; left: -22px; top: 44px; width: 44px; height: 3px;
    background: var(--led-off); border-radius: 2px;
  }
  .stage.lit + .stage::before { background: linear-gradient(90deg, var(--led-green), var(--led-idle)); }
  .stage-led {
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--led-off);
    box-shadow: inset 0 0 8px rgba(0,0,0,.7);
    transition: all .3s;
  }
  .stage-led.running { background: var(--led-run); box-shadow: 0 0 18px var(--led-run), inset 0 0 6px rgba(255,255,255,.4); animation: pulse 1.1s infinite; }
  .stage-led.approve { background: var(--led-green); box-shadow: 0 0 18px var(--led-green); }
  .stage-led.reject { background: var(--led-red); box-shadow: 0 0 18px var(--led-red); }
  .stage-led.delay { background: var(--led-amber); box-shadow: 0 0 18px var(--led-amber); }
  .stage-led.unclear { background: var(--led-blue); box-shadow: 0 0 18px var(--led-blue); }
  .stage-name { font-size: 12px; font-weight: 600; text-align: center; }
  .stage-decision { font-size: 11px; min-height: 14px; color: var(--dim); }
  .stage-decision b.approve { color: var(--led-green); }
  .stage-decision b.reject { color: var(--led-red); }
  .stage-decision b.delay { color: var(--led-amber); }
  .stage-decision b.unclear { color: var(--led-blue); }
  .agent-grid { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; max-width: 170px; }
  .agent-led {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--led-off); transition: all .25s;
  }
  .agent-led.on { background: var(--led-run); box-shadow: 0 0 6px var(--led-run); animation: pulse 1s infinite; }
  .agent-led.done { background: var(--led-green); box-shadow: 0 0 5px var(--led-green); animation: none; }
  .stage-meta { font-size: 10px; color: var(--dim); min-height: 12px; }
  #final-banner {
    margin-top: 14px; padding: 12px; border-radius: 8px; font-size: 12px; line-height: 1.5;
    background: var(--bg); border: 1px solid var(--panel-edge); display: none;
  }
  #final-banner b.approve { color: var(--led-green); }
  #final-banner b.reject { color: var(--led-red); }
  #final-banner b.delay { color: var(--led-amber); }
  #final-banner b.unclear { color: var(--led-blue); }

  /* Feed */
  #feed { height: calc(100vh - 120px); overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
  .feed-item {
    padding: 9px 11px; border-radius: 8px; font-size: 12px; line-height: 1.45;
    background: var(--bg); border: 1px solid var(--panel-edge);
    animation: fadein .35s;
  }
  .feed-item .meta { color: var(--dim); font-size: 10px; margin-bottom: 3px; display: flex; gap: 8px; }
  .feed-item.moment { border-left: 3px solid var(--led-blue); }
  .feed-item.note { border-left: 3px solid var(--led-amber); }
  .feed-item.phase { border-left: 3px solid var(--panel-edge); color: var(--dim); }
  .feed-item.error { border-left: 3px solid var(--led-red); color: var(--led-red); }

  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .45; } }
  @keyframes fadein { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
<header>
  <div id="status-led"></div>
  <h1>INSTITUTIONAL REASONING — DELIBERATION BOARD</h1>
  <div id="total-cost">cost <b>$0.0000</b> · <span id="elapsed">0.0s</span></div>
</header>

<div class="layout">
  <div class="panel">
    <textarea id="issue" placeholder="Describe your issue… e.g. Should we launch the mobile app Feb 1 with 4 devs and no on-call rotation?"></textarea>
    <div class="chip-row" id="pipeline-chips"></div>
    <button id="run-btn" disabled>RUN DELIBERATION</button>
    <div id="routed-note"></div>
  </div>

  <div class="panel">
    <div id="board"></div>
    <div id="final-banner"></div>
  </div>

  <div class="panel">
    <div id="feed"><div class="feed-item phase">thinking stream — waiting for a run</div></div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let selectedPipeline = null;   // null = auto-route
let currentSource = null;
let timer = null;

const DECISION_COLORS = { approve: 'done-ok', reject: 'done-no', delay: 'done-mid', unclear: '' };

// --- pipeline chips ---
fetch('/api/pipelines').then(r => r.json()).then(pipelines => {
  const auto = document.createElement('button');
  auto.className = 'chip selected';
  auto.textContent = 'auto-route';
  auto.onclick = () => select(null, [auto]);
  $('pipeline-chips').appendChild(auto);
  for (const p of pipelines) {
    const b = document.createElement('button');
    b.className = 'chip';
    b.textContent = p.label;
    b.title = p.description;
    b.onclick = () => select(p.name, [auto, ...document.querySelectorAll('.chip')]);
    b.dataset.name = p.name;
    $('pipeline-chips').appendChild(b);
  }
  function select(name, chips) {
    selectedPipeline = name;
    chips.forEach(c => c.classList.remove('selected'));
    name === null ? auto.classList.add('selected') : [...document.querySelectorAll('.chip')].find(c => c.dataset.name === name)?.classList.add('selected');
  }
  $('run-btn').disabled = false;
});

// --- build stage columns from pipeline-start ---
function buildBoard(stages) {
  $('board').innerHTML = '';
  stages.forEach((label, i) => {
    const stage = document.createElement('div');
    stage.className = 'stage';
    stage.id = 'stage-' + i;
    stage.innerHTML = `
      <div class="stage-led" id="sled-${i}"></div>
      <div class="stage-name">${label}</div>
      <div class="stage-decision" id="sdec-${i}"></div>
      <div class="agent-grid" id="agents-${i}"></div>
      <div class="stage-meta" id="smeta-${i}"></div>`;
    $('board').appendChild(stage);
  });
}

function agentLed(stageIndex, agent) {
  const grid = $('agents-' + stageIndex);
  if (!grid) return null;
  let led = document.getElementById(`aled-${stageIndex}-${agent}`);
  if (!led) {
    led = document.createElement('div');
    led.className = 'agent-led';
    led.id = `aled-${stageIndex}-${agent}`;
    led.title = agent;
    grid.appendChild(led);
  }
  return led;
}

function feedItem(cls, meta, text) {
  const el = document.createElement('div');
  el.className = 'feed-item ' + cls;
  el.innerHTML = meta ? `<div class="meta">${meta}</div>` : '';
  el.appendChild(document.createTextNode(text));
  $('feed').prepend(el);
}

// --- run ---
$('run-btn').onclick = () => {
  const issue = $('issue').value.trim();
  if (issue.length < 10) { $('routed-note').textContent = 'Describe the issue in at least a sentence.'; return; }
  if (currentSource) currentSource.close();

  $('feed').innerHTML = '';
  $('board').innerHTML = '';
  $('final-banner').style.display = 'none';
  $('run-btn').disabled = true;
  $('status-led').className = 'running';
  const t0 = Date.now();
  clearInterval(timer);
  timer = setInterval(() => { $('elapsed').textContent = ((Date.now() - t0) / 1000).toFixed(1) + 's'; }, 100);

  fetch('/api/run', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ issue, pipeline: selectedPipeline }),
  }).then(r => r.json()).then(({ id, routed, label, error }) => {
    if (error) { $('routed-note').textContent = error; $('run-btn').disabled = false; return; }
    $('routed-note').innerHTML = `routed to <b>${label}</b>${selectedPipeline ? ' (manual)' : ' (auto)'}`;
    listen(id, t0);
  });
};

function listen(runId, t0) {
  const es = new EventSource('/api/stream/' + runId);
  currentSource = es;
  let totalCost = 0;

  es.onmessage = (ev) => {
    const u = JSON.parse(ev.data);
    const stageTag = u.stageIndex !== undefined ? `stage ${u.stageIndex + 1}` : '';

    switch (u.t) {
      case 'pipeline-start':
        buildBoard(u.stages);
        feedItem('phase', '', `▶ pipeline: ${u.label} — ${u.stages.join(' → ')}`);
        break;
      case 'stage-start': {
        const led = $('sled-' + u.stageIndex);
        if (led) led.className = 'stage-led running';
        break;
      }
      case 'agent-start': {
        const led = agentLed(u.stageIndex, u.agent);
        if (led) led.className = 'agent-led on';
        break;
      }
      case 'agent-end': {
        const led = agentLed(u.stageIndex, u.agent);
        if (led) led.className = 'agent-led done';
        if (u.cost) totalCost += u.cost;
        $('total-cost').firstElementChild.textContent = '$' + totalCost.toFixed(4);
        break;
      }
      case 'phase':
        feedItem('phase', stageTag, `— ${u.name}${u.detail ? ': ' + u.detail : ''}`);
        break;
      case 'note':
        feedItem('note', stageTag, u.text);
        break;
      case 'moment':
        feedItem('moment', `💭 ${stageTag} · ${u.agent}`, u.text);
        break;
      case 'stage-end': {
        const led = $('sled-' + u.stageIndex);
        if (led) led.className = 'stage-led ' + (u.decision === 'unclear' ? 'unclear' : u.decision);
        const stage = $('stage-' + u.stageIndex);
        if (stage) stage.classList.add('lit');
        const dec = $('sdec-' + u.stageIndex);
        if (dec) dec.innerHTML = `<b class="${u.decision}">${u.decision}</b> · ${(u.durationMs / 1000).toFixed(0)}s · $${(u.cost ?? 0).toFixed(4)}`;
        break;
      }
      case 'pipeline-end': {
        es.close();
        clearInterval(timer);
        $('status-led').className = DECISION_COLORS[u.decision] ?? 'done-mid';
        const banner = $('final-banner');
        banner.style.display = 'block';
        banner.innerHTML = `<b class="${u.decision}">${u.decision.toUpperCase()}</b> — ${u.summary || ''}<br><span style="color:var(--dim)">stage decisions: ${u.stageDecisions.join(' → ')} · $${u.cost.toFixed(4)} · ${(u.durationMs / 1000).toFixed(1)}s</span>`;
        feedItem('phase', '', `■ ${u.decision.toUpperCase()} — ${u.summary?.slice(0, 120) ?? ''}`);
        $('run-btn').disabled = false;
        break;
      }
      case 'pipeline-error':
        es.close();
        clearInterval(timer);
        $('status-led').className = 'done-no';
        feedItem('error', '', 'run failed: ' + u.error);
        $('run-btn').disabled = false;
        break;
      case 'ping':
      case 'done':
        break;
    }
  };
}

// Pre-fill a demo issue
$('issue').value = 'Should we launch the mobile app Feb 1 with 4 developers and no on-call rotation?';
</script>
</body>
</html>
